<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101412">
  <meta name="description" content="arXiv reading points and actionable Lean specifications.">
  <title>arxiv5 · Lean Reading Points</title>
  <link rel="stylesheet" href="styles/arxiv5.css">
  <script src="js/arxiv5.js" defer></script>
</head>
<body>
  <main>
    <div class="table-scroll" role="region" aria-label="Lean reading points" tabindex="0">
      <table class="readingpoints">
        <thead>
          <tr>
            <th scope="col">Reading Point</th>
            <th scope="col">Lean Specification</th>
            <th scope="col">arXiv ID</th>
            <th scope="col">Category</th>
            <th scope="col">Title</th>
            <th scope="col">Twitter</th>
          </tr>
        </thead>
        <tbody id="readingpoints-body">
          <tr><td class="empty-state" colspan="6">Loading reading points…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
